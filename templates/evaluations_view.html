<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جداول اختبارات التقييمات</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <div class="back-home">
            <a href="/exams_timeline" class="btn-back">⬅ العودة لقسم الجداول</a>
        </div>

        <div class="hero-section">
            <h1>جداول اختبارات التقييمات</h1>
            <p>اختر الفصل الدراسي لتظهر لك التقييمات الخاصة به بدقة</p>
        </div>

        <div class="section-box" style="max-width: 600px; margin: auto;">
            <form method="POST" class="selection-form">
                
                <div class="form-group">
                    <label for="eval_term">اختر الفصل الدراسي:</label>
                    <select name="eval_term" id="eval_term" onchange="updateEvalOptions()" required>
                        <option value="">-- اختر الفصل الدراسي --</option>
                        <option value="term1" {% if selected_term == 'term1' %}selected{% endif %}>الفصل الدراسي الأول</option>
                        <option value="term2" {% if selected_term == 'term2' %}selected{% endif %}>الفصل الدراسي الثاني</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="eval_type">اختر التقييم:</label>
                    <select name="eval_type" id="eval_type" required>
                        <option value="">-- اختر الفصل الدراسي أولاً --</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">عرض جدول التقييم</button>
            </form>

            {% if error_message %}
                <p class="error-msg" style="color: #ff6b6b; margin-top: 15px; text-align: center;">{{ error_message }}</p>
            {% endif %}

            {% if file_id %}
                <div class="success-box" style="margin-top: 20px; text-align: center;">
                    <a href="/drive/file/{{ file_id }}" target="_blank" class="btn-pdf-glowing">عرض وتنزيل الجدول (PDF)</a>
                </div>
            {% endif %}
        </div>

        <div class="footer-copyright" style="margin-top: 40px;">
            <p>جميع الحقوق محفوظة © روضة ومدرسة القاهرة الإبتدائية الإعدادية</p>
        </div>
    </div>

    <!-- كود الجافاسكريبت لربط القوائم ببعضها ذكياً -->
    <script>
        function updateEvalOptions() {
            const term = document.getElementById('eval_term').value;
            const evalType = document.getElementById('eval_type');
            
            // تفريغ القائمة القديمة
            evalType.innerHTML = '<option value="">-- اختر التقييم المطلوب --</option>';
            
            if (term === 'term1') {
                evalType.innerHTML += '<option value="eval1">اختبار التقييم الأول</option>';
                evalType.innerHTML += '<option value="eval2">اختبار التقييم الثاني</option>';
            } else if (term === 'term2') {
                evalType.innerHTML += '<option value="eval3">اختبار التقييم الثالث</option>';
                evalType.innerHTML += '<option value="eval4">اختبار التقييم الرابع</option>';
            }
        }

        // لتثبيت الاختيار القديم لو الصفحة عملت Refresh
        window.onload = function() {
            const selectedTerm = "{{ selected_term }}";
            const selectedEval = "{{ selected_eval }}";
            if (selectedTerm) {
                document.getElementById('eval_term').value = selectedTerm;
                updateEvalOptions();
                if (selectedEval) {
                    document.getElementById('eval_type').value = selectedEval;
                }
            }
        };
    </script>
</body>
</html>
