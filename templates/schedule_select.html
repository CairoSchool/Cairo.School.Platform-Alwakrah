<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول الحصص - روضة ومدرسة القاهرة الإبتدائية الإعدادية</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>

    <div class="container" data-aos="fade-up">
        <h1 style="margin-bottom: 10px;">جدول الحصص المدرسي</h1>
        <p style="color: var(--text-muted); margin-bottom: 30px;">اختر القسم أولاً، ثم اختر الفصل الدراسي لعرض الجدول</p>
        
        <form id="scheduleForm" style="margin-bottom: 25px;">
            <!-- اختيار القسم (عربي أو لغات) -->
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-main);">اختر القسم الدراسي:</label>
                <select id="sectionSelect" onchange="updateClasses()">
                    <option value="" disabled selected>-- اختر القسم --</option>
                    <option value="arabic">قسم العربي</option>
                    <option value="languages">قسم اللغات</option>
                </select>
            </div>

            <!-- اختيار الفصل (يتغير حسب القسم المختار) -->
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-main);">اختر الفصل:</label>
                <select id="classSelect" onchange="showSchedule()" disabled>
                    <option value="" disabled selected>-- اختر القسم أولاً --</option>
                </select>
            </div>
        </form>

        <div id="scheduleResult" style="margin-top: 25px; text-align: center; background: rgba(15, 23, 42, 0.6); padding: 20px; border-radius: 15px; border: 1px solid var(--border-color);">
            <p style="color: var(--text-muted); margin: 0;">الرجاء اختيار القسم والفصل لعرض الجدول...</p>
        </div>

        <br><br>
        <a href="/" class="btn" style="background: transparent; border: 1px solid var(--accent-color);">← العودة للرئيسية</a>
    </div>

    <script>
        // توليد بيانات الفصول من الصف الأول وحتى التاسع (بدون أي مسافات نهائياً)
        
        // القسم العربي: (1-أول، 1-ثاني، 1-ثالث، 1-رابع ... إلى 9-رابع)
        const arabicSuffixes = ["أول", "ثاني", "ثالث", "رابع"];
        const arabicClasses = [];
        for (let i = 1; i <= 9; i++) {
            arabicSuffixes.forEach(suf => {
                arabicClasses.push(`${i}-${suf}`);
            });
        }

        // قسم اللغات: (1-A, 1-B, 1-C, 1-D ... إلى 9-D)
        const langSuffixes = ["A", "B", "C", "D"];
        const langClasses = [];
        for (let i = 1; i <= 9; i++) {
            langSuffixes.forEach(suf => {
                langClasses.push(`${i}-${suf}`);
            });
        }

        function updateClasses() {
            const section = document.getElementById("sectionSelect").value;
            const classSelect = document.getElementById("classSelect");
            
            // تفعيل قائمة الفصول
            classSelect.disabled = false;
            classSelect.innerHTML = '<option value="" disabled selected>-- اختر الفصل --</option>';

            let optionsList = [];
            if (section === "arabic") {
                optionsList = arabicClasses;
            } else if (section === "languages") {
                optionsList = langClasses;
            }

            // إضافة الفصول المناسبة للقائمة
            optionsList.forEach(cls => {
                let opt = document.createElement("option");
                opt.value = cls;
                opt.textContent = cls;
                classSelect.appendChild(opt);
            });

            // إعادة تعيين النتيجة عند تغيير القسم
            document.getElementById("scheduleResult").innerHTML = "<p style='color: var(--text-muted); margin: 0;'>الرجاء اختيار الفصل لعرض الجدول...</p>";
        }

        function showSchedule() {
            var sectionSelect = document.getElementById("sectionSelect");
            var sectionValue = sectionSelect.value; // arabic أو languages لتحديد المجلد في الدرايف
            var sectionText = sectionSelect.options[sectionSelect.selectedIndex].text;
            var cls = document.getElementById("classSelect").value;
            
            if(cls) {
                // اسم الملف مطابق تماماً بدون أي مسافات (مثال: 1-أول.pdf أو 1-A.pdf)
                var safeClassName = cls;
                
                var pdfPath = `/drive/file_by_name/${sectionValue}/${safeClassName}.pdf`;

                document.getElementById("scheduleResult").innerHTML = `
                    <h3 style='color: var(--accent-color); margin-bottom: 10px;'>جدول حصص (${sectionText}) - فصل ${cls}</h3>
                    <p style='color: var(--text-main); margin-bottom: 15px;'>يمكنك عرض أو تحميل جدول الفصل مباشرة:</p>
                    <a href="${pdfPath}" target="_blank" class="btn" style="background: var(--accent-color); color: #fff; padding: 12px 25px; text-decoration: none; border-radius: 8px; display: inline-block; font-weight: bold;">عرض ملف الـ PDF 📄</a>
                `;
            }
        }
    </script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({ duration: 800, once: true });</script>
</body>
</html>
