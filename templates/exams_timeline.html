<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجدول الزمني وجداول الاختبارات</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* تنسيق المربعات لتكون نظيفة وفي المنتصف وبالمسميات فقط */
        .services-grid {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin: 40px 0;
        }
        .service-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 30px;
            text-decoration: none;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            width: 280px;
        }
        .service-card:hover {
            transform: translateY(-5px);
            border-color: #007bff;
            box-shadow: 0 10px 25px rgba(0, 123, 255, 0.2);
        }
        .service-card p {
            display: none; /* إخفاء النص الوصفي نهائياً كما طلبت */
        }
        .service-card h3 {
            margin-top: 15px;
            font-size: 20px;
            color: #fff;
        }
        .service-card span {
            font-size: 45px;
        }

        /* تنسيق زر العودة في الأسفل بشكل احترافي */
        .bottom-back-container {
            text-align: center;
            margin-top: 50px;
            margin-bottom: 20px;
        }
        .btn-bottom-back {
            display: inline-block;
            padding: 12px 35px;
            background: linear-gradient(135deg, #1f4068, #162447);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .btn-bottom-back:hover {
            background: linear-gradient(135deg, #007bff, #0056b3);
            border-color: #007bff;
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- تم حذف زر العودة العلوي -->

        <div class="hero-section" style="text-align: center; margin-top: 20px;">
            <h1>الجدول الزمني وجداول الاختبارات</h1>
            <p>اختر القسم المطلوب للاطلاع على الجداول واستخراجها بكل سهولة</p>
        </div>

        <!-- المربعات الثلاثة بالمسميات فقط ومنتظمة -->
        <div class="services-grid">
            <a href="/exams_timeline/general" class="service-card">
                <span>📅</span>
                <h3>الجدول الزمني العام</h3>
            </a>

            <a href="/exams_timeline/evaluations" class="service-card">
                <span>📝</span>
                <h3>جداول اختبارات التقييمات</h3>
            </a>

            <a href="/exams_timeline/finals" class="service-card">
                <span>🎓</span>
                <h3>اختبارات نهاية الفصل</h3>
            </a>
        </div>

        <!-- زر العودة للرئيسية في الأسفل بشكل احترافي -->
        <div class="bottom-back-container">
            <a href="/" class="btn-bottom-back">← العودة للصفحة الرئيسية</a>
        </div>

        <div class="footer-copyright" style="text-align: center; margin-top: 30px;">
            <p>جميع الحقوق محفوظة © روضة ومدرسة القاهرة الإبتدائية الإعدادية</p>
        </div>
    </div>

</body>
</html>
