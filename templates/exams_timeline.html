<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجدول الزمني وجداول الاختبارات</title>
    <style>
        body { background-color: #0d1117; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 950px; padding: 20px; box-sizing: border-box; }
        .main-form-box { background: rgba(26, 26, 46, 0.85); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .hero-section h1 { font-size: 26px; margin-bottom: 10px; color: #fff; }
        .hero-section p { color: #a0a0a0; font-size: 15px; margin-bottom: 30px; }
        .services-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin: 30px 0; }
        .service-card { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 15px; border-radius: 12px; background: rgba(255, 255, 255, 0.03); border: 2px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease; width: 230px; color: #fff; text-decoration: none; }
        .service-card:hover { border-color: #00b4d8; background: rgba(0, 180, 216, 0.1); transform: translateY(-4px); }
        .service-card h3 { margin-top: 12px; font-size: 16px; }
        .service-card span { font-size: 35px; }
        .btn-back { display: inline-block; padding: 12px 35px; background: linear-gradient(135deg, #0077b6, #00b4d8); color: #fff; border-radius: 30px; text-decoration: none; font-weight: bold; margin-top: 20px; transition: 0.3s; }
        .btn-back:hover { opacity: 0.9; transform: translateY(-2px); }
        .footer-note { margin-top: 30px; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 20px; font-size: 13px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-form-box">
            <div class="hero-section">
                <h1>الجدول الزمني وجداول الاختبارات</h1>
                <p>اختر القسم المطلوب للانتقال إلى صفحته المستقلة وعرض بياناته</p>
            </div>

            <div class="services-grid">
                <a href="/exams_timeline/timeline" class="service-card">
                    <span>📅</span>
                    <h3>الجدول الزمني العام</h3>
                </a>
                <a href="/exams_timeline/evaluations" class="service-card">
                    <span>📝</span>
                    <h3>جداول اختبارات التقييمات</h3>
                </a>
                <a href="/exams_timeline/finals" class="service-card">
                    <span>🎓</span>
                    <h3>اختبارات نهاية الفصل</h3>
                </a>
            </div>

            <div>
                <a href="/" class="btn-back">⬅ العودة للصفحة الرئيسية</a>
            </div>

            <div class="footer-note">
                جميع الحقوق محفوظة © روضة ومدرسة القاهرة الإبتدائية الإعدادية
            </div>
        </div>
    </div>
</body>
</html>
