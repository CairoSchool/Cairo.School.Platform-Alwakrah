<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجدول الزمني وجداول الاختبارات</title>
    <style>
        body { background-color: #0d1117; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 0; }
        .container { padding: 20px; max-width: 900px; margin: auto; }
        .hero-section { text-align: center; margin-bottom: 30px; }
        .services-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin: 30px 0; }
        .service-card {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 25px 20px; cursor: pointer; border-radius: 15px;
            background: rgba(255, 255, 255, 0.03); border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease; width: 240px; color: #fff;
        }
        .service-card.active, .service-card:hover { border-color: #00b4d8; background: rgba(0, 180, 216, 0.1); }
        .service-card h3 { margin-top: 10px; font-size: 18px; }
        .service-card span { font-size: 35px; }
        
        .main-form-box {
            background: rgba(26, 26, 46, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .form-section { display: none; }
        .form-section.active { display: block; }
        .form-group { margin-bottom: 25px; text-align: right; }
        .form-group label { display: block; margin-bottom: 10px; font-weight: bold; font-size: 16px; color: #e0e0e0; }
        .form-group select {
            width: 100%; padding: 14px; border-radius: 10px; background: #111122; color: #fff; border: 1px solid #444; font-size: 16px; outline: none;
        }
        .btn-submit-custom {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #00b4d8, #0077b6);
            color: #fff; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.4); transition: 0.3s;
        }
        .btn-submit-custom:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="container">
        <div class="hero-section">
            <h1>الجدول الزمني وجداول الاختبارات</h1>
            <p>اختر القسم المطلوب للاطلاع على الجدول واستخراجها بكل سهولة</p>
        </div>

        <!-- المربعات الثلاثة للاختيار -->
        <div class="services-grid">
            <div id="card-timeline" class="service-card active" onclick="switchTab('timeline')">
                <span>📅</span>
                <h3>الجدول الزمني العام</h3>
            </div>
            <div id="card-evaluations" class="service-card" onclick="switchTab('evaluations')">
                <span>📝</span>
                <h3>جداول اختبارات التقييمات</h3>
            </div>
            <div id="card-finals" class="service-card" onclick="switchTab('finals')">
                <span>🎓</span>
                <h3>اختبارات نهاية الفصل</h3>
            </div>
        </div>

        <!-- الصندوق الرئيسي -->
        <div class="main-form-box">
            
            <!-- 1. الجدول الزمني العام -->
            <div id="tab-timeline" class="form-section active">
                <h2 style="text-align: center; margin-bottom: 25px; color: #00b4d8;">الجدول الزمني العام للمدرسة</h2>
                <button type="button" onclick="openFile('timeline', 'timeline')" class="btn-submit-custom">استخراج وعرض الجدول العام 📄</button>
            </div>

            <!-- 2. اختبارات التقييمات -->
            <div id="tab-evaluations" class="form-section">
                <h2 style="text-align: center; margin-bottom: 25px; color: #00b4d8;">جداول اختبارات التقييمات</h2>
                <div class="form-group">
                    <label>اختر الفصل الدراسي:</label>
                    <select id="eval_term" onchange="updateEvalOptions()">
                        <option value="">-- اختر الفصل الدراسي --</option>
                        <option value="term1">الفصل الدراسي الأول</option>
                        <option value="term2">الفصل الدراسي الثاني</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>اختر نوع التقييم:</label>
                    <select id="eval_type">
                        <option value="">-- اختر الفصل الدراسي أولاً --</option>
                    </select>
                </div>
                <button type="button" onclick="openEvaluationFile()" class="btn-submit-custom">استخراج وعرض جدول التقييم 📄</button>
            </div>

            <!-- 3. اختبارات نهاية الفصل -->
            <div id="tab-finals" class="form-section">
                <h2 style="text-align: center; margin-bottom: 25px; color: #00b4d8;">جداول اختبارات نهاية الفصل</h2>
                <div class="form-group">
                    <label>اختر الفصل الدراسي:</label>
                    <select id="final_term">
                        <option value="">-- اختر الفصل الدراسي --</option>
                        <option value="term1">الفصل الدراسي الأول</option>
                        <option value="term2">الفصل الدراسي الثاني</option>
                    </select>
                </div>
                <button type="button" onclick="openFinalFile()" class="btn-submit-custom">استخراج وعرض جدول نهاية الفصل 📄</button>
            </div>

        </div>

        <!-- زر العودة للرئيسية -->
        <div style="text-align: center; margin-top: 40px;">
            <button onclick="window.location.href='/'" style="padding: 12px 35px; background: #162447; color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 30px; font-weight: bold; cursor: pointer;">🏠 العودة للصفحة الرئيسية</button>
        </div>
    </div>

    <!-- كود الجافاسكريبت للتحكم بالقوائم وفتح الملفات في تاب جديد -->
    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.service-card').forEach(card => card.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(section => section.classList.remove('active'));
            
            document.getElementById('card-' + tabName).classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        function updateEvalOptions() {
            const term = document.getElementById('eval_term').value;
            const evalType = document.getElementById('eval_type');
            evalType.innerHTML = '<option value="">-- اختر نوع التقييم --</option>';
            
            if (term === 'term1') {
                evalType.innerHTML += '<option value="eval1">اختبار التقييم الأول</option>';
                evalType.innerHTML += '<option value="eval2">اختبار التقييم الثاني</option>';
            } else if (term === 'term2') {
                evalType.innerHTML += '<option value="eval3">اختبار التقييم الثالث</option>';
                evalType.innerHTML += '<option value="eval4">اختبار التقييم الرابع</option>';
            }
        }

        function openEvaluationFile() {
            const term = document.getElementById('eval_term').value;
            const type = document.getElementById('eval_type').value;
            if(!term || !type) {
                alert('يرجى اختيار الفصل الدراسي ونوع التقييم بدقة.');
                return;
            }
            window.open('/get_exam_file?category=evaluations&term=' + term + '&type=' + type, '_blank');
        }

        function openFinalFile() {
            const term = document.getElementById('final_term').value;
            if(!term) {
                alert('يرجى اختيار الفصل الدراسي.');
                return;
            }
            window.open('/get_exam_file?category=finals&term=' + term, '_blank');
        }

        function openFile(category, type) {
            window.open('/get_exam_file?category=' + category + '&type=' + type, '_blank');
        }
    </script>
</body>
</html>
