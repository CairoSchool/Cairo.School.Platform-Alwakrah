<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجدول الزمني وجداول الاختبارات</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* تنسيق خاص لشبكة الأقسام الثلاثة لضمان ظهورها في صف واحد وبشكل متناسق */
        .services-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        @media (max-width: 768px) {
            .services-grid-3 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="hero-section">
            <h1>الجدول الزمني وجداول الاختبارات</h1>
            <p>اختر القسم المطلوب للانتقال إلى صفحته المستقلة وعرض بياناته بكل سهولة</p>
        </div>

        <!-- القوائم الثلاثة في صف واحد ومطابقة لتصميم باقي الموقع -->
        <div class="services-grid-3">
            <a href="/exams_timeline/timeline" class="service-card">
                <span>📅</span>
                <h3>الجدول الزمني العام</h3>
            </a>
            <a href="/exams_timeline/evaluations" class="service-card">
                <span>📝</span>
                <h3>جداول اختبارات التقييمات</h3>
            </a>
            <a href="/exams_timeline/finals" class="service-card">
                <span>🎓</span>
                <h3>اختبارات نهاية الفصل</h3>
            </a>
        </div>

        <div style="margin-top: 30px;">
            <a href="/" class="btn">⬅ العودة للرئيسية</a>
        </div>

        <div class="footer-copyright">
            <p>جميع الحقوق محفوظة © روضة ومدرسة القاهرة الإبتدائية الإعدادية</p>
        </div>
    </div>

</body>
</html>
