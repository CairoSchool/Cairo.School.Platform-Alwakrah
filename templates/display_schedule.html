<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض جدول الحصص</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="text-align: center; max-width: 600px; margin: 50px auto; padding: 30px;">
        <h1 style="margin-bottom: 25px; color: var(--text-main);">جدول الحصص المدرسي</h1>

        {% if pdf_file_id %}
            <!-- مربع النجاح المضيء (نفس ستايل الشهادات تماماً) -->
            <div style="background: rgba(16, 185, 129, 0.1); border: 2px solid #10b981; padding: 30px; border-radius: 15px; margin-bottom: 25px; box-shadow: 0 4px 20px rgba(16, 185, 129, 0.2);">
                <h3 style="color: #10b981; margin-bottom: 10px; font-size: 22px;">تم العثور على الجدول بنجاح! 🎉</h3>
                <p style="color: var(--text-main); margin-bottom: 20px; font-size: 16px;">اضغط على الزر أدناه لمعاينة الجدول في صفحة مستقلة:</p>
                
                <!-- زر العرض الأخضر المضيء الذي يفتح في تبويب جديد -->
                <a href="{{ url_for('serve_drive_file', file_id=pdf_file_id) }}" target="_blank" class="btn" style="background: #10b981; color: #fff; padding: 14px 30px; text-decoration: none; border-radius: 10px; display: inline-block; font-weight: bold; font-size: 16px; transition: 0.3s; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);">
                    عرض الجدول الآن 📄
                </a>
            </div>
        {% else %}
            <!-- مربع الخطأ لو الجدول مش موجود -->
            <div style="background: rgba(239, 68, 68, 0.1); border: 2px solid #ef4444; padding: 30px; border-radius: 15px; margin-bottom: 25px; box-shadow: 0 4px 20px rgba(239, 68, 68, 0.2);">
                <h3 style="color: #ef4444; margin-bottom: 10px; font-size: 22px;">عذراً! الجدول غير متاح حاليآ ⚠️</h3>
                <p style="color: var(--text-main); margin: 0; font-size: 16px;">{{ error_message }}</p>
            </div>
        {% endif %}

        <!-- زر العودة -->
        <br>
        <a href="/schedule_select" class="btn" style="background: transparent; border: 2px solid var(--accent-color); color: var(--text-main); padding: 10px 25px; border-radius: 8px; text-decoration: none; font-weight: bold; display: inline-block;">
            ← العودة لاختيار فصل آخر
        </a>
    </div>
</body>
</html>
