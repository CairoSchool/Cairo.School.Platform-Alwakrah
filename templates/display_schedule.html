<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول الحصص - روضة ومدرسة القاهرة الإبتدائية الإعدادية</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>

    <div class="container" data-aos="fade-up">
        <h1 style="margin-bottom: 10px;">جدول الحصص المدرسي</h1>
        <p style="color: var(--text-muted); margin-bottom: 30px;">اختر القسم أولاً، ثم اختر الفصل الدراسي لعرض الجدول</p>
        
        <form action="/display_schedule" method="POST" style="margin-bottom: 25px;">
            <!-- اختيار القسم (عربي أو لغات) -->
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-main);">اختر القسم الدراسي:</label>
                <select id="sectionSelect" name="section" onchange="updateClasses()" required>
                    <option value="" disabled selected>-- اختر القسم --</option>
                    <option value="arabic">قسم العربي</option>
                    <option value="languages">قسم اللغات</option>
                </select>
            </div>

            <!-- اختيار الفصل (يتغير حسب القسم المختار) -->
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-main);">اختر الفصل:</label>
                <select id="classSelect" name="grade" onchange="enableSubmit()" disabled required>
                    <option value="" disabled selected>-- اختر القسم أولاً --</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" class="btn" style="background: var(--accent-color); color: #fff; width: 100%; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; opacity: 0.6;" disabled>عرض الجدول 📄</button>
        </form>

        <br>
        <a href="/" class="btn" style="background: transparent; border: 1px solid var(--accent-color);">← العودة للرئيسية</a>
    </div>

    <script>
        // القسم العربي: (1-ا، 1-ب، 1-ج، 1-د ... إلى 9-د) بدون همزات
        const arabicSuffixes = ["ا", "ب", "ج", "د"];
        const arabicClasses = [];
        for (let i = 1; i <= 9; i++) {
            arabicSuffixes.forEach(suf => {
                arabicClasses.push(`${i}-${suf}`);
            });
        }

        // قسم اللغات: (1-A, 1-B, 1-C, 1-D ... إلى 9-D)
        const langSuffixes = ["A", "B", "C", "D"];
        const langClasses = [];
        for (let i = 1; i <= 9; i++) {
            langSuffixes.forEach(suf => {
                langClasses.push(`${i}-${suf}`);
            });
        }

        function updateClasses() {
            const section = document.getElementById("sectionSelect").value;
            const classSelect = document.getElementById("classSelect");
            
            classSelect.disabled = false;
            classSelect.innerHTML = '<option value="" disabled selected>-- اختر الفصل --</option>';

            let optionsList = [];
            if (section === "arabic") {
                optionsList = arabicClasses;
            } else if (section === "languages") {
                optionsList = langClasses;
            }

            optionsList.forEach(cls => {
                let opt = document.createElement("option");
                opt.value = cls;
                opt.textContent = cls;
                classSelect.appendChild(opt);
            });

            document.getElementById("submitBtn").disabled = true;
            document.getElementById("submitBtn").style.opacity = "0.6";
        }

        function enableSubmit() {
            const cls = document.getElementById("classSelect").value;
            const submitBtn = document.getElementById("submitBtn");
            if (cls) {
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
            }
        }
    </script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({ duration: 800, once: true });</script>
</body>
</html>
